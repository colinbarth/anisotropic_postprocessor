[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anisotropic_postprocessor"
version = "0.1.0"
description = "G-code postprocessor and machine simulator for anisotropic 3D printing paths from path_optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["3d-printing", "gcode", "postprocessor", "anisotropic", "continuous-fiber", "path-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["anisotropic_postprocessor"]

[tool.hatch.build.targets.sdist]
include = ["anisotropic_postprocessor", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E702", "E731", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
